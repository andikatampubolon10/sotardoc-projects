name: Deploy Next.js to Arenhost

on:
  push:
    branches:
      - main
    paths:
      - 'sotardoc-landing/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sotardoc-landing/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: sotardoc-landing
        run: npm ci

      - name: 🏗️ Build Next.js Application
        working-directory: sotardoc-landing
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📁 Prepare Deployment Package
        run: |
          mkdir -p deploy
          cp -r sotardoc-landing/.next deploy/.next
          cp -r sotardoc-landing/public deploy/public
          cp -r sotardoc-landing/lib deploy/lib || true
          cp -r sotardoc-landing/data deploy/data || true
          cp -r sotardoc-landing/database deploy/database || true
          cp sotardoc-landing/package.json deploy/package.json
          cp sotardoc-landing/package-lock.json deploy/package-lock.json || true
          cp sotardoc-landing/server.js deploy/server.js
          # Sinyal restart otomatis untuk Phusion Passenger (cPanel Node.js App)
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      - name: 🚀 Deploy to Arenhost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DESTINATION || 'sotardoc/' }}
          local-dir: ./deploy/
          dangerous-clean-slate: false
